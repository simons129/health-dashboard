<style>

function baselineZ(series, day, recentDays) {
  const pick = (lo, hi) => {
    const out = [];
    for (let i = lo; i <= hi; i++) {
      const v = series.get(addDays(day, -i));
      if (v != null) out.push(v);
    }
    return out;

  const recent = pick(0, recentDays - 1), base = pick(recentDays, recentDays + 59);
  if (recent.length < Math.ceil(recentDays / 2) || base.length < 14) return null;
  const m = mean(base);
  return (median(recent) - m) / spread(base, m);
}

    title: name.replace(/^Motra - /, "").replace(/^\w+ (Morning|Afternoon|Evening|Night) /, "").replace(/ (Strength )?(Session|Workout|Training|Focus)$/, ""),

function buildAlerts() {

  const rest = new Map(state.rest.map((r) => [r.day, r.bpm]));
  const base = [];
  for (let i = 3; i < 63; i++) {
    const bpm = rest.get(addDays(today, -i));
    if (bpm != null) base.push(bpm);
  }
  if (base.length >= 20) {
    const normal = median(base);
    const recent = [0, 1, 2].map((i) => rest.get(addDays(today, -i))).filter((bpm) => bpm != null);
    const high = recent.filter((bpm) => bpm >= normal + ALERT_REST_BPM);
    if (high.length >= ALERT_REST_DAYS) {
      add("rest", "critical", "Pokojový tep je zvýšený", `${Math.max(...high)} bpm, bežne okolo ${normal}. Môže ísť o únavu, stres, alkohol alebo začínajúcu chorobu, zváž ľahší deň.`, "#/");
    }
  }

  const hoursBetween = (from, to) => state.activities.reduce((sum, a) => {
    const age = daysBetween(a.start_date_local.slice(0, 10), today);
    return age >= from && age < to ? sum + duration(a) / 3600 : sum;
  }, 0);
  const week = hoursBetween(0, 7), usual = hoursBetween(7, 35) / 4;
  if (usual >= ALERT_MIN_WEEKLY_HOURS && week >= usual * ALERT_LOAD_RATIO) {
    add("load", "warning", "Prudký nárast záťaže", `${num(week, 1)} h za 7 dní, bežne ${num(usual, 1)} h. Daj si pozor na preťaženie.`, "#/kalendar");
  }

  const lastDay = state.activities.reduce((latest, a) => (a.start_date_local.slice(0, 10) > latest ? a.start_date_local.slice(0, 10) : latest), "");
  const pause = lastDay ? daysBetween(lastDay, today) : 0;
  if (pause >= ALERT_PAUSE_DAYS) add("pause", "warning", "Dlhšia pauza", `Posledný tréning bol pred ${plural(pause, "dňom", "dňami", "dňami")}.`, "#/kalendar");

  const missed = state.plans.filter((plan) => plan.day < today && daysBetween(plan.day, today) <= 7 && !planDone(plan));
  if (missed.length >= ALERT_MISSED_PLANS) add("missed", "warning", "Nesplnené plány", `Za posledný týždeň ${plural(missed.length, "nesplnený tréning", "nesplnené tréningy", "nesplnených tréningov")}. Možno je plán priveľa.`, "#/kalendar");

  if (state.workouts[0] && daysBetween(state.workouts[0].day, today) < ALERT_REGION_DAYS) {
    for (const region of REGIONS) {
      const last = state.workouts.find((w) => regionsOf({ name: w.title }).includes(region) || w.region === "Celé telo");
      const gap = last ? daysBetween(last.day, today) : null;
      if (gap != null && gap >= ALERT_REGION_DAYS) add(`region-${region.id}`, "warning", `${region.label} je zanedbaná`, `Naposledy pred ${plural(gap, "dňom", "dňami", "dňami")}.`, "#/sila");
    }
  }

  const synced = [...state.totals.keys()].reduce((latest, day) => (day > latest ? day : latest), "");
  const stale = synced ? daysBetween(synced, today) : 0;
  if (stale >= ALERT_STALE_DAYS) add("sync", "warning", "Apple Zdravie sa nesynchronizuje", `Posledné dáta sú staré ${plural(stale, "deň", "dni", "dní")}. Otvor aplikáciu a klikni na Sync Now.`, "#/");
  return alerts;
}

// and an open day sheet keeps its own scrolling.
const PULL_READY = 70, PULL_MAX = 110;
const pull = document.getElementById("pull");
let pullFrom = null, pulled = 0;
function placePull(distance) {
  const y = Math.min(distance, PULL_MAX);
  pull.style.transform = `translateY(${y + 44}px) rotate(${Math.min(distance / PULL_READY, 1) * 180}deg)`;
  pull.style.opacity = String(Math.min(distance / PULL_READY, 1));
  pull.classList.toggle("ready", distance >= PULL_READY);
}
addEventListener("touchstart", (event) => {
  if (scrollY > 0 || event.touches.length !== 1 || syncing || !state.trend || event.target.closest(".chart, .panel.sheet, textarea, input")) return;
  pullFrom = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  pull.classList.remove("settle", "spinning");
}, { passive: true });
addEventListener("touchmove", (event) => {
  if (!pullFrom) return;
  const dx = event.touches[0].clientX - pullFrom.x, dy = event.touches[0].clientY - pullFrom.y;
  if (dy <= 0 || Math.abs(dx) > dy || scrollY > 0) { pulled = 0; placePull(0); return; }
  pulled = dy * 0.55;
  placePull(pulled);
}, { passive: true });
addEventListener("touchend", () => {
  if (!pullFrom) return;
  pullFrom = null;
  pull.classList.add("settle");
  if (pulled < PULL_READY) { pulled = 0; placePull(0); return; }
  pulled = 0;
  pull.style.transform = "translateY(64px)";
  pull.classList.add("spinning");
  state.loadedAt = 0;
  syncStrava().finally(() => { pull.classList.remove("spinning"); placePull(0); });
});

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
apiKey ? start() : login();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
