<title>Zdravie</title>

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6e68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --hr: #e34948; --hrv: #6250d6;
  --ride: #2a78d6; --run: #eb6834; --strength: #1baf7a; --other: #eda100;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9c9a92;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.07);
    --hr: #e66767; --hrv: #9085e9;
    --ride: #3987e5; --run: #d95926; --strength: #199e70; --other: #c98500;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 1080px; margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
h1 { margin: 0; font-size: 22px; font-weight: 650; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
.note { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
button, input {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px; min-height: 36px; padding: 0 11px;
}
button { cursor: pointer; }
button:hover { background: var(--wash); }
:focus-visible { outline: 2px solid var(--ride); outline-offset: 1px; }
.link { border: 0; background: none; color: var(--ink-2); padding: 0 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--surface); }
.daypick { display: flex; gap: 4px; align-items: center; }
.daypick button { width: 36px; padding: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.tile { padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 620; line-height: 1.25; }
.tile .value small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile.hero { grid-column: span 2; }
.tile.hero .value { font-size: 50px; line-height: 1.1; }
.tile .delta { color: var(--ink-2); font-size: 12.5px; }

.card { padding: 14px 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.grid2 .card { margin-bottom: 0; }
.grid2 { margin-bottom: 12px; }
.card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12.5px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.line { height: 2px; width: 16px; border-radius: 1px; vertical-align: 3px; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; touch-action: pan-y; }
.chart svg:focus-visible { outline-offset: 2px; }
.chart text { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart text.region { fill: var(--ink-2); }
.empty { color: var(--ink-2); padding: 32px 0; text-align: center; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; min-height: 24px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--ink-2); font-weight: 500; }
th, td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.readiness { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; margin-bottom: 8px; }
.score { font-size: 44px; font-weight: 640; line-height: 1; }
.region { margin-top: 12px; }
.region-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }

nav.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--grid); }

nav.tabs a[aria-current=page] { color: var(--ink); border-bottom-color: var(--ink); }
.seg a { display: flex; align-items: center; min-height: 36px; padding: 0 12px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--border); margin-left: -1px; }
.seg a:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg a:last-child { border-radius: 0 7px 7px 0; }
.seg a[aria-current=true] { background: var(--ink); color: var(--surface); }
.sila { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 12px; align-items: start; }

.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

.ex .right { flex: none; color: var(--ink-2); font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
.hint { color: var(--ink-2); font-size: 12.5px; margin: 8px 0; }
.ex-tag { color: var(--ink-2); font-size: 12px; margin: 10px 0 -6px; }
.badge { border: 1px solid var(--hrv); border-radius: 5px; padding: 0 5px; font-size: 11.5px; color: var(--ink); }
.sets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

.subnav { margin-bottom: 12px; max-width: 100%; overflow-x: auto; white-space: nowrap; }
.subnav a { flex: none; }
.group-head { color: var(--ink-2); font-size: 12.5px; font-weight: 600; margin: 14px 0 2px; }

.record:hover { background: var(--wash); }
.record .main { min-width: 0; flex: 1; }
.record .title { font-weight: 600; font-size: 13.5px; }
.record .sub { color: var(--ink-2); font-size: 12.5px; }
.record .value { flex: none; text-align: right; font-size: 13.5px; font-weight: 620; }
.record .value small { display: block; color: var(--ink-2); font-size: 12px; font-weight: 450; }
.plan-line { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.plan-line b { color: var(--ink); font-size: 14px; font-weight: 640; }
.muscle { display: grid; grid-template-columns: 76px minmax(0, 1fr) 112px; gap: 10px; align-items: center; margin-top: 9px; font-size: 13px; }
.muscle .value { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muscle .value b { color: var(--ink); font-weight: 620; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--wash); }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--hrv); }
.track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-bottom: 12px; align-items: start; }
.grid3 .card { margin-bottom: 0; }
.grid3 + .card { margin-top: 12px; }
.trend { display: flex; gap: 10px; align-items: center; padding: 9px 8px; margin: 0 -8px; border-top: 1px solid var(--grid); border-radius: 7px; color: inherit; text-decoration: none; }
.trend:hover { background: var(--wash); }
.trend .main { min-width: 0; flex: 1; }
.trend .title { font-weight: 600; font-size: 13.5px; }
.trend .sub { color: var(--ink-2); font-size: 12.5px; }
.trend .pct { font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trend svg { flex: none; width: 56px; height: 24px; }
.calendar { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
.calendar .panel { position: sticky; top: 10px; }
.cal { display: grid; grid-template-columns: 46px repeat(7, minmax(0, 1fr)) 46px; gap: 3px; align-items: center; margin-top: 10px; }
.cal .head { color: var(--ink-2); font-size: 12px; text-align: center; }
.cal .week { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.cal .count { color: var(--ink-2); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.day { display: flex; height: 30px; border-radius: 5px; overflow: hidden; background: var(--wash); text-decoration: none; color: #fff; font-size: 13px; font-weight: 650; }
.day span { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.day .light { color: #0b0b0b; }
.day:hover { filter: brightness(1.12); }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day[aria-current=true] { outline: 2px solid var(--ink); outline-offset: 1px; }
.day.future { background: none; pointer-events: none; }
.show-more { width: 100%; margin-top: 10px; }
.visit { display: block; padding: 10px 0; border-top: 1px solid var(--grid); color: inherit; text-decoration: none; }
.visit .title { font-weight: 600; font-size: 13.5px; }
.visit .sub { color: var(--ink-2); font-size: 12.5px; }
a.visit:hover .title { text-decoration: underline; }
@media (max-width: 860px) {
  .calendar { grid-template-columns: minmax(0, 1fr); }
  .calendar .panel { position: static; order: -1; }
}
.rows-plain { margin-top: 4px; }
.more { display: block; margin-top: 12px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
.more:hover { color: var(--ink); }
.metric { margin: 12px 0 8px; }
@media (max-width: 760px) {
  .sila { grid-template-columns: minmax(0, 1fr); }
  .sila .list { position: static; }
  .rows { max-height: none; }
  .sila[data-detail=true] .list { display: none; }
  .sila[data-detail=false] .detail { display: none; }
  .back { display: inline-block; }
}
.meter { height: 8px; border-radius: 4px; background: var(--wash); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--hrv); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 2px; }
.status i { width: 18px; height: 18px; border-radius: 50%; color: #fff; font: 700 12px/18px system-ui, sans-serif; text-align: center; }
.status.warning i { color: #0b0b0b; }
.parts { color: var(--ink-2); font-size: 13px; }
#tip {
  position: fixed; z-index: 10; pointer-events: none; min-width: 120px; max-width: 240px;
  padding: 7px 10px; border-radius: 8px; font-size: 12.5px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.14);
}
#tip .title { color: var(--ink-2); margin-bottom: 2px; }
#tip .row { display: flex; gap: 7px; align-items: center; }
#tip .row b { font-weight: 650; }
#tip .row span { color: var(--ink-2); }
#tip .row i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.loading .tiles, .loading .card { opacity: .55; }
.login { max-width: 360px; margin: 14vh auto 0; }
.login form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.login input { width: 100%; }
.error { color: var(--ink); font-size: 13px; }
</style>

<script>
const API = "https://backend.servatka29.workers.dev";
const KEY_NAME = "backend_api_key";

};
const READINESS_HISTORY = 130;

const REGIONS = [
  { id: "upper", label: "Horná časť", hours: 48, words: /\b(upper|chest|back|shoulders?|arms?|lats|biceps?|triceps?|push|pull|forearms?)\b/i },

const MUSCLES = [
  ["Brucho", /crunch|russian twist|ab coaster/i],
  ["Nohy", /leg|squat|lunge|calf|hamstring|glute/i],

  ["Hrudník", /bench press|chest press|fly|pec dec/i],

const SPORT_RANGES = [[90, "3 mes."], [182, "6 mes."], [365, "1 rok"], [0, "Všetko"]];
const MIN_TREND_POINTS = 3;
// Below this a 100 m pace is a lap the watch cut wrong, not real swimming.
const FASTEST_PACE_100M = 60;
const REST_SPEED_SHARE = 0.6;
const MIN_SET_REPEATS = 3;
const ROLLING_ACTIVITIES = 5;
// Scarf's rule: a metre of climbing costs a runner about as much as 7.92 metres on the flat.
const RUN_CLIMB_FACTOR = 7.92;

  beh: {
    label: "Beh", color: "var(--run)", types: ["Run", "TrailRun", "VirtualRun"], minKm: 3, climb: RUN_CLIMB_FACTOR, paceLabel: "Tempo", lowerIsFaster: true,

    records: [["Najdlhší", "distance"], ["Najrýchlejších 5 km+", "fast", 5], ["Najrýchlejších 10 km+", "fast", 10], ["Najviac stúpania", "climb"]],
    efficiencyNote: "Metre na jeden úder srdca, prepočítané o stúpanie. Vyššie je lepšie.",
  },
  bicykel: {

    pace: (a) => a.average_speed * 3.6, paceText: (v) => `${num(v, 1)} km/h`,
    records: [["Najdlhšia", "distance"], ["Najrýchlejších 50 km+", "fast", 50], ["Najrýchlejších 100 km+", "fast", 100], ["Najviac stúpania", "climb"]],

    records: [["Najdlhšie", "distance"], ["Najrýchlejšie", "fast", 0]],
    efficiencyNote: "Metre na jeden úder srdca. Vyššie je lepšie.",
  },
};
const RECORD_DAYS = 30;
const TREND_DAYS = 28;
const TREND_THRESHOLD = 2.5;
// A month cannot change strength this much, it means another machine or a logging mistake.
const SUSPICIOUS_CHANGE = 30;
const CALENDAR_WEEKS = 26;
// Same colors as the training volume chart, so a sport looks the same on every page.
const ACTIVITY_ICONS = {
  Ride: "🚴", VirtualRide: "🚴", EBikeRide: "🚴", GravelRide: "🚴", MountainBikeRide: "🚴",
  Run: "🏃", TrailRun: "🏃", VirtualRun: "🏃", Walk: "🚶", Hike: "🥾", Swim: "🏊",
};
const REGION_LETTERS = { "Horná časť": "H", "Spodná časť": "S", "Celé telo": "C" };
const WORKING_SET_SHARE = 0.9;
const WARMUP_SHARE = 0.6;
const COMPOUND_REPS = 10, ISOLATION_REPS = 12, CORE_REPS = 20;
const HARD_RIDE_SCORE = 50;
const RANGES = [[7, "7 dní"], [30, "30 dní"], [90, "90 dní"], [365, "1 rok"]];

const state = { range: 30, day: localDay(new Date()), trend: null, dayDoc: null, readiness: [], recovery: [], strength: [], workouts: [], activities: [], sportRange: 365, sportMetric: "efficiency", swims: new Map(), weeks: CALENDAR_WEEKS, totals: new Map(), rest: [], weight: [], vo2: [], fat: null, lean: null, metric: "weight", search: "" };

function storedKey() {
  try { return localStorage.getItem(KEY_NAME) || ""; } catch { return ""; }
}
function saveKey(value) {
  try { value ? localStorage.setItem(KEY_NAME, value) : localStorage.removeItem(KEY_NAME); } catch {}
}
let apiKey = storedKey();

/* Helpers */
const SVG_NS = "http://www.w3.org/2000/svg";
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  el.append(...kids.filter(Boolean));
  return el;
}
function s(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) k === "text" ? (el.textContent = v) : el.setAttribute(k, v);
  el.append(...kids.filter(Boolean));
  return el;
}
function localDay(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
function addDays(day, n) {
  const d = new Date(`${day}T12:00:00`);
  d.setDate(d.getDate() + n);
  return localDay(d);
}
function daysBetween(from, to) {
  return Math.round((new Date(`${to}T12:00:00`) - new Date(`${from}T12:00:00`)) / 864e5);

const clamp = (v) => Math.max(0, Math.min(100, v));
const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
const spread = (values, m) => Math.sqrt(mean(values.map((v) => (v - m) ** 2))) || 1;

// Distance of the last recentDays from the personal baseline of the 60 days before them.
function baselineZ(series, day, recentDays) {
  const pick = (lo, hi) => {
    const out = [];
    for (let i = lo; i <= hi; i++) {
      const v = series.get(addDays(day, -i));
      if (v != null) out.push(v);
    }
    return out;
  };
  const recent = pick(0, recentDays - 1), base = pick(recentDays, recentDays + 59);
  if (recent.length < Math.ceil(recentDays / 2) || base.length < 14) return null;
  const m = mean(base);
  return (median(recent) - m) / spread(base, m);
}

function bodySignals(hrv, resting, strava) {
  const busy = strava.map((a) => {
    const start = Date.parse(a.start_date);
    return [start - 18e5, start + a.elapsed_time * 1e3 + 54e5];
  });
  const calmHrv = new Map();
  for (const doc of hrv) {
    const values = Object.entries(doc.samples ?? {})
      .filter(([time]) => !busy.some(([a, b]) => Date.parse(time) >= a && Date.parse(time) <= b))
      .map(([, sample]) => Math.log(sample[0]));
    if (values.length) calmHrv.set(doc.day, median(values));
  }
  return { calmHrv, rest: new Map(resting.map((r) => [r.day, r.bpm])) };
}

function bodyScore(signals, day, recentDays) {
  const hrvZ = baselineZ(signals.calmHrv, day, recentDays), restZ = baselineZ(signals.rest, day, recentDays);
  const values = [hrvZ, restZ == null ? null : -restZ].filter((z) => z != null);
  return values.length ? clamp(50 + 25 * mean(values)) : null;
}

// Without overnight data a single day of HRV is noise: on two years of history neither morning
// nor all-day HRV reacted to the previous day's training. The score therefore leans on training
// load, and body signals count only as a 7 day trend against the personal baseline.
function readinessSeries(from, signals, strava) {
  const today = localDay(new Date());
  const load = new Map();
  for (const a of strava) {
    const day = a.start_date_local.slice(0, 10);
    load.set(day, (load.get(day) ?? 0) + (a.suffer_score || duration(a) / 60));
  }
  const series = [];
  let acute = 0, chronic = 0;
  for (let day = from; day <= today; day = addDays(day, 1)) {
    acute += ((load.get(day) ?? 0) - acute) / 7;
    chronic += ((load.get(day) ?? 0) - chronic) / 42;
    if (daysBetween(day, today) >= READINESS_DAYS || chronic < 1) continue;
    const ratio = acute / chronic;
    const loadScore = clamp(100 - (ratio - 0.6) * 100);
    const body = bodyScore(signals, day, 7);
    series.push({ day, ratio, loadScore, bodyScore: body, score: Math.round(body == null ? loadScore : 0.6 * loadScore + 0.4 * body) });
  }
  return series;
}

// Same-day signals only, so it follows the day's HRV readings and can swing a lot.
function recoverySeries(signals) {
  const today = localDay(new Date());
  const series = [];
  for (let back = READINESS_DAYS - 1; back >= 0; back--) {
    const day = addDays(today, -back);
    const score = signals.calmHrv.has(day) ? bodyScore(signals, day, 1) : null;
    if (score != null) series.push({ day, score: Math.round(score), hrv: Math.exp(signals.calmHrv.get(day)) });
  }
  return series;
}

// Motra writes the whole workout into the Strava description.
function parseWorkout(doc) {
  const { name, start_date_local: start, description } = doc.data;
  const regions = regionsOf({ name });
  const workout = {
    id: doc.id, day: start.slice(0, 10), region: regions.length === REGIONS.length ? "Celé telo" : regions[0].label,
    title: name.replace(/^Motra - /, "").replace(/^\w+ (Morning|Afternoon|Evening|Night) /, "").replace(/ (Strength )?(Session|Workout|Training|Focus)$/, ""),
    time: /Duration:\s*(.+)/.exec(description)?.[1].trim().replace("h", " h").replace("m", " min") ?? "", volume: 0, sets: 0, exercises: [],
  };
  const volume = /^TVL:\s*([\d.]+)(K?)/.exec(description.trim().split(/\r?\n/).find((l) => l.startsWith("TVL:")) ?? "");
  if (volume) workout.volume = Number(volume[1]) * (volume[2] ? 1000 : 1);
  let current = null, superset = false;
  for (const raw of description.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /^(Tracked with|TVL:|Duration:|Calories:|Exercises:)/.test(line)) {
      if (!line) superset = false;
      continue;
    }
    if (line === "Superset") { superset = true; continue; }
    const set = /^Set \d+:\s*(.*)$/.exec(line);
    if (!set) {
      current = { name: line, superset, sets: [] };
      workout.exercises.push(current);
    } else if (current) {
      const parsed = /^(\d+) reps x (?:([\d.]+) kg|BW)( per side)?/.exec(set[1]);
      current.sets.push(parsed
        ? { reps: +parsed[1], kg: parsed[2] ? +parsed[2] : null, perSide: !!parsed[3] }
        : { text: set[1] });
      workout.sets++;
    }
  }
  return workout;
}
function setLabel(set) {
  if (set.text) return set.text;
  const load = set.kg == null ? "vlastná váha" : `${num(set.kg, set.kg % 1 ? 1 : 0)} kg`;
  return `${set.reps} × ${load}${set.perSide ? " / strana" : ""}`;
}

function regionsOf(activity) {
  const hit = REGIONS.filter((r) => r.words.test(activity.name));
  return /full body/i.test(activity.name) || !hit.length ? REGIONS : hit;
}

function strengthStatus(strava, setsById = new Map(), now = Date.now()) {
  const week = now - 7 * 864e5;
  return REGIONS.map((region) => {
    let remaining = 0, sessions = 0;
    for (const a of strava) {
      const end = Date.parse(a.start_date) + a.elapsed_time * 1e3;
      const lifting = a.sport_type === "WeightTraining" && regionsOf(a).includes(region);
      const legCardio = region.id === "lower" && (["Run", "TrailRun", "Hike"].includes(a.sport_type) || (a.sport_type === "Ride" && a.suffer_score >= HARD_RIDE_SCORE));
      if (!lifting && !legCardio) continue;
      if (lifting && end >= week) sessions++;
      const sets = setsById.get(String(a.id));
      const cost = lifting ? Math.max(0.75, Math.min(1.5, sets ? sets / TYPICAL_SETS : duration(a) / 3600)) : LEG_CARDIO_COST;
      remaining = Math.max(remaining, region.hours * cost - (now - end) / 36e5);
    }
    return { ...region, sessions, remaining, score: Math.round(clamp(100 * (1 - remaining / region.hours))) };
  });
}
function periods() {
  const today = localDay(new Date());
  const from = addDays(today, -(state.range - 1));
  return { today, from, prevFrom: addDays(from, -state.range) };

function groupOf(activity) {

// Samples come irregularly, much denser during a workout, so each 5 minute window counts once.
function dayBuckets(doc) {
  const buckets = new Map();
  for (const [time, [avg, min, max]] of Object.entries(doc?.samples ?? {})) {
    const date = new Date(time);
    if (localDay(date) !== state.day) continue;
    const minute = Math.floor((date.getHours() * 60 + date.getMinutes()) / 5) * 5;
    const b = buckets.get(minute) ?? { minute, values: [], lo: Infinity, hi: -Infinity };
    b.values.push(avg);
    b.lo = Math.min(b.lo, min);
    b.hi = Math.max(b.hi, max);
    buckets.set(minute, b);
  }
  return [...buckets.values()].sort((a, b) => a.minute - b.minute).map((b) => ({ ...b, avg: mean(b.values) }));
}

/* Charts */
function niceTicks(lo, hi, count = 4) {
  const span = hi - lo || 1;
  const raw = span / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((m) => m >= raw);
  const ticks = [];
  for (let v = Math.floor(lo / step) * step; v < hi + step; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function frame(el, height, ticks, label, tickText) {
  const width = Math.max(el.clientWidth, 260);
  const m = { top: 10, right: 12, bottom: 24, left: 34 };
  const svg = s("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img", "aria-label": label, tabindex: 0 });
  const plot = { x: m.left, y: m.top, w: width - m.left - m.right, h: height - m.top - m.bottom };
  const y = (v) => plot.y + plot.h - ((v - ticks[0]) / (ticks[ticks.length - 1] - ticks[0])) * plot.h;
  ticks.forEach((t, i) => {
    svg.append(s("line", { x1: plot.x, x2: plot.x + plot.w, y1: y(t), y2: y(t), stroke: i ? "var(--grid)" : "var(--axis)" }));
    svg.append(s("text", { x: plot.x - 7, y: y(t) + 4, "text-anchor": "end", text: tickText ? tickText(t) : t >= 1000 ? `${num(t / 1000, t % 1000 ? 1 : 0)}k` : num(t) }));
  });
  return { svg, plot, y };
}
function lineChart(el, { height = 230, x, xMin, xMax, xTicks, series, band, regions = [], gap, label, read, tickText }) {
  const all = series.flatMap((sr) => sr.values).concat(band ? [...band.lo, ...band.hi] : []).filter((v) => v != null);
  const pad = (Math.max(...all) - Math.min(...all)) * 0.08 || 2;
  const ticks = niceTicks(Math.min(...all) - pad, Math.max(...all) + pad);
  const { svg, plot, y } = frame(el, height, ticks, label, tickText);
  const px = (v) => plot.x + ((v - xMin) / (xMax - xMin || 1)) * plot.w;

  for (const r of regions) {
    const x1 = px(Math.max(r.from, xMin)), x2 = px(Math.min(r.to, xMax));
    svg.append(s("rect", { x: x1, y: plot.y, width: Math.max(x2 - x1, 2), height: plot.h, fill: "var(--wash)" }));
    if (x2 - x1 > 34) svg.append(s("text", { class: "region", x: x1 + 4, y: plot.y + 12, text: r.label }));
  }
  for (const t of xTicks) svg.append(s("text", { x: px(t.v), y: plot.y + plot.h + 17, "text-anchor": t.anchor ?? "middle", text: t.label }));

  const segments = (lo, hi = lo) => {
    const parts = [[]];
    x.forEach((v, i) => {
      if (lo[i] == null) { parts.push([]); return; }
      const last = parts[parts.length - 1];
      if (last.length && gap && v - x[last[last.length - 1]] > gap) parts.push([]);
      parts[parts.length - 1].push(i);
    });
    return parts.filter((p) => p.length);
  };
  if (band) {
    for (const part of segments(band.lo)) {
      const top = part.map((i) => `${px(x[i])},${y(band.hi[i])}`);
      const bottom = part.slice().reverse().map((i) => `${px(x[i])},${y(band.lo[i])}`);
      svg.append(s("polygon", { points: [...top, ...bottom].join(" "), fill: band.color, opacity: 0.14 }));
    }
  }
  for (const sr of series) {
    if (sr.dots) {

        s("circle", { cx: px(v), cy: y(sr.values[i]), r: 4, fill: sr.color, opacity: sr.opacity ?? 1, stroke: "var(--surface)", "stroke-width": 2 })));
    } else {
      for (const part of segments(sr.values)) {
        svg.append(s("polyline", { points: part.map((i) => `${px(x[i])},${y(sr.values[i])}`).join(" "), fill: "none",
          stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      }
    }
  }

  const cross = s("line", { y1: plot.y, y2: plot.y + plot.h, stroke: "var(--axis)", visibility: "hidden" });
  const marker = s("circle", { r: 4.5, fill: series[series.length - 1].color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  svg.append(cross, marker);
  let current = 0;
  const show = (i, event) => {
    current = i;
    const cx = px(x[i]);
    const v = series[series.length - 1].values[i];
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    marker.setAttribute("cx", cx);
    if (v != null) { marker.setAttribute("cy", y(v)); marker.setAttribute("visibility", "visible"); } else marker.setAttribute("visibility", "hidden");
    const { title, rows } = read(i);
    const box = svg.getBoundingClientRect();
    showTip(event, { left: box.left + cx * (box.width / svg.viewBox.baseVal.width), top: box.top + 30, width: 0 }, title, rows);
  };
  const clear = () => { cross.setAttribute("visibility", "hidden"); marker.setAttribute("visibility", "hidden"); hideTip(); };
  svg.addEventListener("pointermove", (event) => {
    const box = svg.getBoundingClientRect();
    const at = xMin + (((event.clientX - box.left) * (svg.viewBox.baseVal.width / box.width) - plot.x) / plot.w) * (xMax - xMin);
    let best = 0;
    x.forEach((v, i) => { if (Math.abs(v - at) < Math.abs(x[best] - at)) best = i; });
    show(best, event);
  });
  svg.addEventListener("pointerleave", clear);
  svg.addEventListener("blur", clear);
  svg.addEventListener("focus", () => show(current));
  svg.addEventListener("keydown", (event) => {
    const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
    if (!step) return;
    event.preventDefault();
    show(Math.max(0, Math.min(x.length - 1, current + step)));
  });
  el.replaceChildren(svg);
}
function barChart(el, { height = 230, bars, label, format = (v) => `${num(v, 1)} h` }) {
  const maxTotal = Math.max(...bars.map((b) => b.total), 1);
  const ticks = niceTicks(0, maxTotal);
  const { svg, plot, y } = frame(el, height, ticks, label);
  svg.removeAttribute("tabindex");
  const slot = plot.w / bars.length;
  const width = Math.min(24, Math.max(slot - 2, 2));
  const every = Math.ceil(bars.length / Math.floor(plot.w / 52));
  bars.forEach((bar, i) => {
    const left = plot.x + i * slot + (slot - width) / 2;
    const group = s("g", { tabindex: bar.total ? 0 : -1, role: "img", "aria-label": `${bar.title}: ${format(bar.total)}` });
    let base = y(0);
    const parts = bar.parts.filter((p) => p.value > 0);
    parts.forEach((p, n) => {
      const barHeight = Math.max(y(0) - y(p.value) - (n ? 2 : 0), 1);
      const top = base - barHeight - (n ? 2 : 0);
      const r = n === parts.length - 1 ? Math.min(4, barHeight, width / 2) : 0;
      const bottom = top + barHeight;
      group.append(s("path", { fill: p.color, d:
        `M${left},${bottom}V${top + r}Q${left},${top} ${left + r},${top}H${left + width - r}Q${left + width},${top} ${left + width},${top + r}V${bottom}Z` }));
      base = top;
    });
    group.append(s("rect", { x: plot.x + i * slot, y: plot.y, width: slot, height: plot.h, fill: "transparent" }));
    const rows = () => [...parts].reverse().map((p) => ({ color: p.color, value: format(p.value), label: p.label }));
    if (bar.total) {
      group.addEventListener("pointermove", (event) => showTip(event, null, bar.title, rows()));
      group.addEventListener("pointerleave", hideTip);
      group.addEventListener("focus", () => showTip(null, group.getBoundingClientRect(), bar.title, rows()));
      group.addEventListener("blur", hideTip);
    }
    svg.append(group);
    if (i % every === 0) svg.append(s("text", { x: left + width / 2, y: plot.y + plot.h + 17, "text-anchor": "middle", text: bar.tick }));
  });
  el.replaceChildren(svg);
}

function tabs(page) {
  const tab = (id, href, label) => h("a", { href, text: label, ...(page === id ? { "aria-current": "page" } : {}) });
  return h("nav", { class: "tabs" }, tab("prehlad", "#/", "Prehľad"), tab("sila", "#/sila", "Sila"), tab("vytrvalost", "#/vytrvalost", "Vytrvalosť"), tab("kalendar", "#/kalendar", "Kalendár"));
}
function render() {
  const { page } = route();
  const head = h("header", {}, h("h1", { text: "Zdravie" }), h("button", { class: "link", text: "Odhlásiť", onclick: logout }));
  if (page === "sila") {
    app.replaceChildren(head, tabs(page), ...strengthView());
  } else if (page === "vytrvalost") {
    app.replaceChildren(head, tabs(page), ...sportView());
  } else if (page === "kalendar") {
    app.replaceChildren(head, tabs(page), ...calendarView());
  } else {
    const cards = [h("div", { class: "grid2" }, strengthCard(), recoveryCard()), readinessCard(), dayCard(),
      h("div", { class: "grid2" }, hrvCard(), restCard()),
      h("div", { class: "grid2" }, measureCard("Hmotnosť", weightNote(), state.weight, "kilograms", 1, "kg", "var(--ride)"),
        measureCard("VO2 Max", "Kondícia podľa Apple Watch", state.vo2, "vo2_ml_per_min_per_kg", 1, "ml/kg/min", "var(--strength)")),
      h("div", { class: "grid2" }, totalsCard("Kroky", "steps", "krokov", "var(--ride)"), totalsCard("Aktívne kalórie", "active_calories", "kcal", "var(--run)")),
      loadCard(), workoutsCard()];
    app.replaceChildren(head, tabs(page), filters(), ...cards.slice(0, 2), tiles(), ...cards.slice(2));
  }
  drawCharts();
}
function showError() {
  app.classList.remove("loading");
  app.replaceChildren(h("div", { class: "card login" }, h("h1", { text: "Dáta sa nepodarilo načítať" }),
    h("p", { class: "note", text: "Server momentálne neodpovedá. Skús to o chvíľu znova." }),
    h("form", { onsubmit: (e) => { e.preventDefault(); start(); } }, h("button", { text: "Skúsiť znova" }))));
}
async function refresh(work) {
  app.classList.add("loading");
  try {
    await work();
    render();
  } catch (error) {
    if (error.message !== "unauthorized") showError();
  } finally {
    app.classList.remove("loading");
  }
}
function selectRange(days) {
  state.range = days;
  refresh(loadTrend);
}
function selectDay(day) {
  state.day = day;
  refresh(loadDay);
}
const start = () => refresh(() => Promise.all([loadTrend(), loadDay(), loadReadiness(), loadBody()]));

function logout() {
  apiKey = "";
  saveKey("");
  login();
}
function login(message) {
  const input = h("input", { type: "password", required: "", autocomplete: "current-password", placeholder: "API kľúč", "aria-label": "API kľúč" });
  const error = h("p", { class: "error", text: message ?? "" });
  const form = h("form", { onsubmit: async (event) => {
    event.preventDefault();
    apiKey = input.value.trim();
    const res = await fetch(`${API}/api`, { headers: { Authorization: `Bearer ${apiKey}` } }).catch(() => null);
    if (res?.ok) { saveKey(apiKey); start(); return; }
    error.textContent = res?.status === 401 ? "Tento kľúč nie je správny." : "Server momentálne neodpovedá.";
  } }, input, h("button", { text: "Prihlásiť" }), error);
  app.replaceChildren(h("div", { class: "card login" }, h("h1", { text: "Zdravie" }),
    h("p", { class: "note", text: "Zadaj API kľúč. Uloží sa len v tomto prehliadači." }), form));
  input.focus();
}

addEventListener("hashchange", () => {
  if (!state.trend) return;
  render();
  // The day panel stays in view beside the calendar, a jump to the top would only lose the week.
  if (!(route().page === "kalendar" && innerWidth > 860)) scrollTo(0, 0);
});

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
apiKey ? start() : login();
</script>
</body>
</html>
